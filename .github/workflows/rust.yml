name: Sanity check (Nightly Rust) & Deploy to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo fmt --check --all

      - run: cargo clippy

      - run: cargo nextest run --all --all-features

  docker-ghcr:
    needs: [rust]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Publish Docker image with tag latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.authors="swyrin"
            org.opencontainers.image.source=https://github.com/swyrin/nameless
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish Docker image with commit tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.authors="swyrin"
            org.opencontainers.image.source=https://github.com/swyrin/nameless
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
