name: rust

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        rust-version: [ 1.94, 1.95 ]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust ${{ matrix.rust-version }}
        run: |
          rustup install ${{ matrix.rust-version }} --profile default
          rustup default ${{ matrix.rust-version }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-${{ matrix.rust-version }}"

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run rustfmt
        run: |
          cargo fmt --check --all

      - name: Run clippy
        run: |
          cargo clippy

      - name: Run nextest
        run: |
          cargo nextest run --all

      - name: Run smoke build
        run: |
          cargo build
