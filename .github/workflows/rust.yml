name: rust

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  TOKEN: Discord-1234567890
  TEST_SERVER_ID: 1234567890
  DATABASE_URL: postgres://postgres:nameless@localhost:5432

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-1.97"

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - run: cargo fmt --check --all

      - run: cargo clippy --all

      - run: cargo nextest run --all --all-features

      - run: cargo build

  docker:
    runs-on: ubuntu-latest
    needs: rust

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Publish Docker image with tag latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish Docker image with commit tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
