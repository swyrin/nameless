name: rust

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.97
        run: |
          rustup install 1.97 --profile default
          rustup default 1.97

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0-rust-1.97"

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run rustfmt
        run: |
          cargo fmt --check --all

      - name: Run clippy
        run: |
          cargo clippy

      - name: Run nextest
        run: |
          cargo nextest run --all

      - name: Run smoke build
        run: |
          cargo build
