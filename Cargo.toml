[package]
name = "nameless-ng"
version = "0.1.0"
edition = "2024"
default-run = "nameless-ng"

[workspace]
members = [".", "crates/viphurit", "crates/xkcd-nameless"]
default-members = ["."]

[workspace.dependencies]
viphurit = { path = "crates/viphurit" }
xkcd-nameless = { path = "crates/xkcd-nameless" }

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.35"
poise = { version = "0.6.2" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4+spec-1.1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
viphurit = { workspace = true }
xkcd-nameless = { workspace = true }

[profile.release]
debug = 2
lto = "thin"
panic = "abort"
