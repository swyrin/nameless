[package]
name = "nameless-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.7.0"
rand = "0.10.2"
reqwest = "0.13.5"
sea-orm = {
  version = "2.0.2",
  features = [
    "debug-print",
    "entity-registry",
    "runtime-tokio",
    "schema-sync",
    "sqlx-sqlite",
  ]
}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
songbird = { version = "0.6.0", features = ["builtin-queue"] }
tokio = {
  version = "1.53.1",
  features = [
    "macros",
    "rt-multi-thread",
    "test-util",
  ]
}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"
codegen-units = 1
