[package]
name = "nameless-ng"
version = "0.1.0"
edition = "2024"
default-run = "nameless-ng"

[workspace]
members = [".", "crates/viphurit", "crates/xkcd-nameless"]
default-members = ["."]

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.35"
poise = "0.6.2"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
viphurit = { path = "crates/viphurit" }
xkcd-nameless = { path = "crates/xkcd-nameless" }
dotenv-ng = { version = "1.0.0", features = ["macros"] }

[profile.release]
strip = true
lto = true
panic = "abort"
