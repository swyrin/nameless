[package]
name = "nameless-ng"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/viphurit", "crates/xkcd"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }

[dependencies]
jiff = "0.2.35"
poise = "0.6.2"
tokio = { workspace = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
viphurit = { path = "crates/viphurit" }
xkcd = { path = "crates/xkcd" }
dotenv-ng = { version = "1.0.0", features = ["macros"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "z"
