[package]
name = "nameless-ng"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/xkcd"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }

[dependencies]
aho-corasick = "1.1.5"
poise = "0.6.2"
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio", "debug-print", "entity-registry", "schema-sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { workspace = true }
xkcd = { path = "crates/xkcd" }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
opt-level = "z"
