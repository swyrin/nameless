name: nameless

services:
  nameless-bot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      nameless-db:
        condition: service_healthy
  
  nameless-db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nameless
      POSTGRES_PASSWORD: nameless
      POSTGRES_DATABASE: nameless
    restart: unless-stopped
    volumes:
      - nameless-pg-volume:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nameless -d nameless" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nameless-pg-volume: