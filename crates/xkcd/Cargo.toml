[package]
name = "xkcd"
version = "0.1.0"
edition = "2024"

[features]
default = ["async"]

async = []

blocking = ["reqwest/blocking"]

[dependencies]
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tokio = { workspace = true }
